name: Release

on:
  push:
    tags: ["v2.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  on-main:
    name: Tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history of main, for the ancestry check
          persist-credentials: false

      - name: The tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points at $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi

  check:
    name: CI
    needs: on-main
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, sign, attest, publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # keyless cosign signature and the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the tags to find the previous release
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Install this runner's archive the way users will: checksum, cosign
      # bundle against this workflow's identity, archive layout. Then check
      # that the tag reached the binary through the ldflags.
      - name: Install with install.sh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mirror="$RUNNER_TEMP/github"
          mkdir -p "$mirror/$GITHUB_REPOSITORY/releases/download"
          ln -s "$GITHUB_WORKSPACE/dist" "$mirror/$GITHUB_REPOSITORY/releases/download/$TAG"
          PIC_SURE_INSTALL_GITHUB_URL="file://$mirror" \
            ./install.sh --repo "$GITHUB_REPOSITORY" --version "$TAG" --bin-dir "$RUNNER_TEMP/bin"
          out="$("$RUNNER_TEMP/bin/pic-sure" version)"
          echo "$out" | grep -F -- "version $TAG," \
            || { echo "::error::'pic-sure version' printed '$out', which does not name $TAG" >&2; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
