name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: CLI (test, lint)
    runs-on: ubuntu-latest
    env:
      PICSURE_PTY_TEST: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Same pinned version as local development. The version lives only in
      # the Makefile.
      - name: Install golangci-lint
        run: |
          version="$(make -s print-lint-version)"
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/$version/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "$version"

      # go.mod/go.sum must match the import graph; catches missing
      # `go mod tidy` (e.g. direct deps mislabeled // indirect).
      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check (gofmt, vet, lint, test)
        run: make check

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck install.sh
