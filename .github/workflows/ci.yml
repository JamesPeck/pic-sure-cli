name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

# A new push to a PR cancels its older run; runs for pushes to v2 all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Under CI the PTY smoke test skips unless asked for. The Docker-backed
    # tests run on Ubuntu and skip on macOS, whose runners have no Docker.
    env:
      PICSURE_PTY_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Same pinned version as local development. The version lives only in
      # the Makefile.
      - name: Install golangci-lint
        run: |
          version="$(make -s print-lint-version)"
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/$version/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "$version"

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check (gofmt, vet, lint, unit, goldens, testscript)
        run: make check

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The check leg validates the goldens under the runner's compose; this
      # job validates them under the oldest one doctor accepts. Raising
      # MinComposeVersion past COMPOSE_VERSION fails here until both move.
      - name: Install the oldest compose doctor accepts
        env:
          COMPOSE_VERSION: v2.29.7
          COMPOSE_SHA256: 383ce6698cd5d5bbf958d2c8489ed75094e34a77d340404d9f32c4ae9e12baf0
        run: |
          min="$(sed -nE 's/^[[:space:]]*MinComposeVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/ops/doctor.go)"
          if [ -z "$min" ]; then
            echo "::error::MinComposeVersion not found in internal/ops/doctor.go"
            exit 1
          fi
          dir="$HOME/.docker/cli-plugins"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/docker-compose" \
            "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64"
          echo "$COMPOSE_SHA256  $dir/docker-compose" | sha256sum -c -
          chmod +x "$dir/docker-compose"
          have="$(docker compose version --short)"
          have="${have#v}"
          if [ "$have" != "${COMPOSE_VERSION#v}" ]; then
            echo "::error::docker compose is $have, not the installed $COMPOSE_VERSION"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$min" "$have" | sort -V | head -n1)" != "$min" ]; then
            echo "::error::compose $have is older than doctor's minimum $min; raise COMPOSE_VERSION"
            exit 1
          fi

      - name: docker compose config --quiet on every golden
        run: make compose-check

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck install.sh smoke/install_test.sh

  release:
    name: Release snapshot + install.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Unsigned, with no SBOM or upload (.goreleaser.yaml skips them for
      # snapshots).
      - name: Snapshot build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean

      - name: install.sh tests
        run: bash smoke/install_test.sh dist
